# Update pull requests for the direct dependencies and the CI actions.
#
# Deliberately absent: the `gitsubmodule` ecosystem. `vendor/obsidian-tasks`
# moves by hand, with a run against a real vault behind it and the README
# version updated in the same commit — see CONTRIBUTING.md, "Keeping the
# submodule current". A bot must not touch it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Not ours: the engine's runtime dependencies, which obsidian-tasks
      # declares in its own package.json (chrono-node even pinned exactly).
      # They move with the submodule, when upstream moves them — never on
      # their own, because a green test run does not prove the engine works
      # against a version it was never written for. Advisories in them still
      # surface through the `audit` job in CI.
      - dependency-name: '@floating-ui/dom'
      - dependency-name: async-mutex
      - dependency-name: boon-js
      - dependency-name: chrono-node
      - dependency-name: eventemitter2
      - dependency-name: flatpickr
      - dependency-name: i18next
      - dependency-name: moment
      - dependency-name: mustache
      - dependency-name: mustache-validator
      - dependency-name: rrule
      - dependency-name: safe-regex2

      # TypeScript majors wait for typescript-eslint to support them, and
      # the vendor tree is written against TypeScript 5.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
